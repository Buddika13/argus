# Monitored DNS resolvers.
#
# role: isp     -> the subject of the research (a Sri Lankan ISP resolver)
# role: control -> known-good public resolvers used as a baseline
#
# IMPORTANT: the ISP addresses below are PLACEHOLDERS in the reserved
# documentation range (RFC 5737, 192.0.2.0/24 / 203.0.113.0/24). No real ISP
# resolver IP is hard-coded. Replace each `address` with the resolver actually
# handed out by that ISP at your vantage point, then set `enabled: true`.

resolvers:
  # --- Sri Lankan ISPs (fill in real addresses, then enable) -------------
  - name: slt
    address: 192.0.2.11        # REPLACE with SLT's resolver IP
    role: isp
    isp: SLT
    country: LK
    enabled: false

  - name: mobitel
    address: 192.0.2.12        # REPLACE with Mobitel's resolver IP
    role: isp
    isp: Mobitel
    country: LK
    enabled: false

  - name: dialog
    address: 192.0.2.13        # REPLACE with Dialog's resolver IP
    role: isp
    isp: Dialog
    country: LK
    enabled: false

  - name: hutch
    address: 192.0.2.14        # REPLACE with Hutch's resolver IP
    role: isp
    isp: Hutch
    country: LK
    enabled: false

  # --- public control resolvers (safe to run by default) ----------------
  - name: google
    address: 8.8.8.8
    role: control
    isp: Google
    country: ANY
    enabled: true

  - name: cloudflare
    address: 1.1.1.1
    role: control
    isp: Cloudflare
    country: ANY
    enabled: true

  - name: quad9
    address: 9.9.9.9
    role: control
    isp: Quad9
    country: ANY
    enabled: true

  # Verified reachable from a Sri Lankan vantage point (probed with
  # scripts/discover_resolvers.py: NOERROR, AD flag set). Widening the control
  # set strengthens the cross-check stage of the anomaly engine.
  - name: opendns
    address: 208.67.222.222
    role: control
    isp: OpenDNS
    country: ANY
    enabled: true

  # AdGuard filters by design and answered www.boc.lk from a different CDN edge
  # (108.159.15.0/24) than the authoritative zone published (13.35.163.0/24),
  # while all four other resolvers matched it exactly. A control that disagrees
  # with ground truth corrupts the cross-check stage, so it is not one.
  - name: adguard
    address: 94.140.14.14
    role: isp
    isp: AdGuard
    country: ANY
    enabled: false

  # --- laboratory only: the deliberately poisoned resolver ----------------
  # Set enabled: true ONLY while scripts/demo_hijack.py --serve is running, to
  # show a poisoned resolver beside healthy ones on the live dashboard. It is a
  # loopback process under our own control; no third-party resolver is involved.
  - name: lab-poisoned
    address: 127.0.0.1
    port: 5354
    role: isp
    isp: Laboratory
    country: LAB
    enabled: false

  # Additional independent controls. Both were verified from this vantage:
  # they agree with the authoritative answer, and they return NXDOMAIN for a
  # non-existent name rather than redirecting it to an address. That second
  # test matters -- a resolver that hijacks NXDOMAIN cannot serve as a
  # corroborating source, which is why AdGuard was demoted.
  - name: verisign
    address: 64.6.64.6
    role: control
    isp: Verisign
    country: ANY
    enabled: true

  # Level3 (4.2.2.1) was trialled and disabled: it answered one test domain
  # correctly but failed to answer nominet.uk, jprs.jp, afnic.fr and
  # registro.br at all. A control that intermittently fails weakens the
  # cross-check and slows every sweep, so it is not one.
  - name: level3
    address: 4.2.2.1
    role: control
    isp: Level3
    country: ANY
    enabled: false
